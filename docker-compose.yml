version: '3.8'

services:
  # 1. FastAPI Application Layer with Prophet ML Engine
  backend:
    build:
      context: ./price-prediction-system
      dockerfile: backend/Dockerfile
    container_name: pricespy_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=local_development_secret_key_32_chars_min
    depends_on:
      - redis
    volumes:
      - ./price-prediction-system/ml_engine/data:/app/ml_engine/data
      - ./price-prediction-system/backend/pricespy.db:/app/backend/pricespy.db

  # 2. React User Interface Layer
  frontend:
    build:
      context: ./price-prediction-system/frontend
      dockerfile: Dockerfile
    container_name: pricespy_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

  # 3. Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: pricespy_redis
    ports:
      - "6379:6379"
