<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F1F" />
      <stop offset="50%" stop-color="#171717" />
      <stop offset="100%" stop-color="#06110C" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#A31C1B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#06110C" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFA4B0" />
      <stop offset="30%" stop-color="#FF2E56" />
      <stop offset="100%" stop-color="#A31C1B" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06110C" stop-opacity="0.98" />
    </linearGradient>

    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="bullseyeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="12" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="4" />

  <circle cx="246" cy="251" r="148" fill="url(#lensGrad)" stroke="#A31C1B" stroke-width="8" stroke-opacity="0.6" />

  <g stroke="#A31C1B" stroke-width="6" stroke-opacity="0.45" fill="none">
    <path d="M 246,103 C 297,133 348,184 364,235" />
    <path d="M 394,251 C 369,312 323,358 261,384" />
    <path d="M 246,399 C 185,373 138,323 123,261" />
    <path d="M 97,251 C 123,190 174,138 230,108" />
    <circle cx="246" cy="251" r="72" stroke="#A31C1B" stroke-width="5" stroke-dasharray="14 14" stroke-opacity="0.4" />
  </g>

  <line x1="246" y1="72" x2="246" y2="92" stroke="#FF385C" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="246" y1="410" x2="246" y2="430" stroke="#FF385C" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="67" y1="251" x2="87" y2="251" stroke="#FF385C" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="405" y1="251" x2="425" y2="251" stroke="#FF385C" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8" />

  <path d="M 97,118 L 190,230 L 246,184 L 389,374" stroke="#A31C1B" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45" filter="url(#crimsonGlow)" />
  <path d="M 97,118 L 190,230 L 246,184 L 389,374" stroke="url(#laserGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <circle cx="97" cy="118" r="14" fill="#FFA4B0" />
  <circle cx="190" cy="230" r="12" fill="#FFA4B0" />
  <circle cx="246" cy="184" r="12" fill="#FFA4B0" />

  <g transform="translate(389, 374)">
    <circle cx="0" cy="0" r="44" fill="#171717" stroke="#FF2E56" stroke-width="10" filter="url(#bullseyeGlow)" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#A31C1B" stroke-width="8" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
  </g>
</svg>
